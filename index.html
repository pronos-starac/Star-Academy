<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pronos Star Academy</title>
<meta name="description" content="Pronostics entre amis pour la Star Academy saison 14 : qui ira le plus loin ?">
<meta name="theme-color" content="#16040a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pronos Star Ac">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sticky stage header with five screens. Look: prime-time stage of the 2026 season, crimson backdrop, gold light rays, gold stars. Dark only, by choice. */
:root{
  --bg:#16040a; --panel:#26070f; --panel2:#360a18; --line:#5e1729;
  --text:#fff5ee; --muted:#dcb0b9;
  --gold:#f8c94a; --gold2:#ffe7a3; --red:#d8152f;
  --ko:#ff3b57; --imm:#5fd8ff; --nom:#ff9f43; --ok:#4ee08f;
  --f-display:'Anton','Impact','Arial Narrow Bold',sans-serif;
  --f-body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.4 var(--f-body);-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 70% at 50% -10%,#7a0b1f 0%,#3a0612 45%,var(--bg) 80%) fixed,var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background:repeating-conic-gradient(from 0deg at 50% -6%,rgba(248,201,74,.09) 0deg 2.2deg,transparent 2.2deg 13deg);
  -webkit-mask-image:radial-gradient(90% 80% at 50% 0%,#000 0%,transparent 75%);mask-image:radial-gradient(90% 80% at 50% 0%,#000 0%,transparent 75%)}
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
a{color:var(--gold)}
h2,h3,p{margin:0}
h2{font:400 clamp(24px,5vw,34px)/1.05 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
h3{font:400 18px/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.muted{color:var(--muted)}
input[type=text]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:10px;font:inherit}
input[type=text]:focus{outline:2px solid var(--gold);outline-offset:0}
code,.mono{font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}

/* header */
.top{position:sticky;top:0;z-index:5;background:rgba(22,4,10,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:2px solid var(--line);padding-block:12px 0;margin-inline:-16px;padding-inline:16px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.brand h1{margin:0;display:flex;align-items:center;gap:.25em;font:400 clamp(26px,6vw,40px)/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.brand h1 em{font-style:normal;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#c98a12);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand h1 .star{width:.8em;height:.8em;flex:none;fill:var(--gold);filter:drop-shadow(0 0 8px rgba(248,201,74,.6))}
.meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.when{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);padding:3px 8px}
.pill b{color:var(--gold);font-weight:700}
.tabs{display:flex;gap:4px 18px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;background:transparent;border:0;border-bottom:4px solid transparent;padding:10px 2px 8px;font-weight:700;font-size:14px;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.tab[aria-selected=true]{color:var(--gold2);border-bottom-color:var(--gold)}
.note{margin-top:14px;background:var(--panel2);border-left:4px solid var(--nom);padding:10px 12px;font-size:15px}
main{padding-top:18px;display:flex;flex-direction:column;gap:18px}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;max-width:calc(100% - 32px);background:var(--gold);color:#2a1300;font-weight:700;padding:10px 14px;border-radius:3px}

/* generic */
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 40%),var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:inline-block;text-decoration:none;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%);color:#2a1300;border:0;border-radius:3px;padding:10px 14px;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 3px 0 #9c7b0e}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9c7b0e}
.btn[disabled]{background:var(--panel2);color:var(--muted);box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--ko);color:#fff;box-shadow:0 3px 0 #9d1631}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sub{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.save{font-size:14px;font-weight:600;color:var(--muted)}
.save.ok{color:var(--ok)}.save.err{color:var(--ko)}

/* portraits */
.av{position:relative;overflow:hidden;display:grid;place-items:center;flex:none;aspect-ratio:1;max-width:100%;font-family:var(--f-display);color:#fff;
  background:linear-gradient(135deg,hsl(var(--h) 75% 55% / .55),transparent 55%),hsl(var(--h) 55% 34%);
  clip-path:polygon(0 0,100% 0,100% 80%,86% 100%,0 100%)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.tg{font:700 11px/1 var(--f-body);letter-spacing:.06em;padding:3px 4px;margin-left:auto;flex:none}
.tg.ko{background:var(--ko);color:#fff}.tg.imm{color:var(--imm)}.tg.nom{color:var(--nom)}.tg.win{color:var(--gold)}
.tg.ok{color:var(--ok)}.tg.bad{color:var(--ko)}

/* select screen : photos 50 % plus grandes */
.sel-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:18px;align-items:start}
.sel-wrap .fighter{grid-column:2;grid-row:1;position:sticky;top:150px}
.sel-main{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.sel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(147px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:7px;padding:8px 8px 10px;background:var(--panel);border:2px solid var(--line);border-radius:4px;text-align:left;overflow:hidden}
.tile .av{width:100%;aspect-ratio:4/5;font-size:60px}
.tile .nm{font:400 22px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.tile .st{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.tile[aria-pressed=true]{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(248,201,74,.35)}
.tile.st-nom .st{color:var(--nom)}.tile.st-imm .st{color:var(--imm)}.tile.st-win .st{color:var(--gold)}.tile.st-ko .st{color:var(--ko)}
.tile.st-ko .av{filter:grayscale(1) brightness(.55)}
.tile.st-ko::after{content:"KO";position:absolute;top:26%;left:-8%;right:-8%;text-align:center;font:400 28px/1 var(--f-display);color:#fff;background:var(--ko);padding:5px 0;transform:rotate(-12deg)}
.fighter .big{display:flex;gap:14px;align-items:center}
.fighter .big .av{width:100px;aspect-ratio:4/5;font-size:60px}
.fighter .big h2{font-size:38px}
.status{display:inline-block;margin-top:6px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line)}
.status.nom{color:var(--nom);border-color:var(--nom)}.status.imm{color:var(--imm);border-color:var(--imm)}
.status.ko{color:#fff;background:var(--ko);border-color:var(--ko)}.status.win{color:var(--gold);border-color:var(--gold)}
.stat{display:flex;flex-direction:column;gap:5px}
.stat .lbl{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.stat .lbl span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.hp{position:relative;height:14px;background:var(--bg);border:1px solid var(--line)}
.hp i{display:block;height:100%;background:var(--ok)}
.hp.gold i{background:linear-gradient(90deg,#c98a12,var(--gold),var(--gold2))}
.hp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--bg) 9px 10px)}

/* bracket */
.seg-bar{display:inline-flex;align-self:flex-start;border:1px solid var(--line);max-width:100%}
.seg{background:var(--panel);border:0;padding:8px 14px;font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.seg.on{background:var(--gold);color:#2a1300}
.bracket-scroll{overflow-x:auto;border:1px solid var(--line);background:var(--panel);padding:14px 14px 16px}
.bracket{display:flex;gap:10px;min-width:max-content}
.col{display:flex;flex-direction:column;gap:8px;width:122px;flex:none}
.col-h{display:flex;flex-direction:column;gap:2px;border-bottom:2px solid var(--line);padding-bottom:6px;min-height:42px}
.col-h span{font:400 13px/1 var(--f-display);letter-spacing:.03em}
.col-h small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col.now .col-h{border-bottom-color:var(--gold)}.col.now .col-h span{color:var(--gold)}
.col.fut .col-h span{color:var(--muted)}
.col-b{display:flex;flex-direction:column;justify-content:center;gap:4px;height:calc(var(--n) * 34px)}
.chip{display:flex;align-items:center;gap:6px;height:30px;padding:0 5px 0 3px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;text-align:left;min-width:0}
.chip .av{width:24px;font-size:13px}
.chip .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip.st-nom{border-color:var(--nom)}.chip.st-imm{border-color:var(--imm)}.chip.st-win{border-color:var(--gold)}
.chip.st-ko{border-color:var(--ko)}.chip.st-ko .nm{text-decoration:line-through;opacity:.8}
.chip.st-ko .av{filter:grayscale(1)}
.chip.focus{outline:2px solid var(--gold);outline-offset:1px}
.chip.ghost{border-style:dashed;background:transparent;justify-content:center;color:var(--muted);font-weight:700}
.chip[disabled]{opacity:.45;cursor:default}
.wr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 0;border-top:1px solid var(--line)}
.wr>b{min-width:80px}.wr-el{display:inline-flex;align-items:center;gap:8px;font-weight:700}.wr-el .av{width:34px;aspect-ratio:4/5;font-size:16px}
.nowbar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.trombi{margin-bottom:22px}
.trombi-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.trombi-grid .tile{padding:6px 6px 8px;gap:5px}
.trombi-grid .tile .av{font-size:44px}
.trombi-grid .tile .nm{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trombi-grid .tile .st{font-size:11px;letter-spacing:.05em}
.trombi-grid .tile.st-ko::after{font-size:22px;padding:4px 0}
@media (max-width:820px){.trombi-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.trombi-grid .tile .nm{font-size:16px}.trombi-grid .tile .st{font-size:10px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend b{font-weight:700}

/* mon prono */
.who-card{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.who-card .fld{display:flex;gap:8px;flex:1 1 260px;min-width:0}
.gated .top{display:none}
.gate{max-width:560px;margin:0 auto;padding-block:min(8vh,64px) 24px;display:flex;flex-direction:column;gap:18px;text-align:center}
.gate .card{text-align:left}
.gate-title{margin:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.1em .22em;font:400 clamp(36px,10vw,68px)/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.gate-title em{font-style:normal;white-space:nowrap;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#c98a12);-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-title .star{width:.7em;height:.7em;flex:none;fill:var(--gold);filter:drop-shadow(0 0 12px rgba(248,201,74,.7))}
.gate-sub{color:var(--muted);font-size:18px}
.gate-faces{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;max-width:420px;margin:0 auto;width:100%}
.gate-faces .av{width:100%;aspect-ratio:4/5;font-size:14px}
.gate-faces .av:nth-child(n+10){transform:translateX(50%)}
.spoil{border-left-color:var(--imm)}
.linkbtn{background:none;border:0;padding:0;color:var(--gold2);font-weight:700;text-decoration:underline;cursor:pointer}
.check{display:flex;gap:8px;align-items:flex-start;font-size:15px;text-align:left}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--gold);flex:none}
.spoilck{flex-basis:100%;color:var(--muted)}
.plink{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;grid-template-columns:40px minmax(0,1fr) auto 18px}
.plink:hover{border-color:var(--gold)}
.chev{color:var(--muted);font-size:22px}
.ptsbig{font:400 34px/1 var(--f-display);color:var(--gold2)}
.ptsbig small{font:600 14px var(--f-body);color:var(--muted)}
.final-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
#rankGrid .pcard{cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#rankGrid .pcard *{pointer-events:none;-webkit-user-drag:none;-webkit-touch-callout:none}
#rankGrid .pcard:active{cursor:grabbing}
#rankGrid .grip{position:absolute;top:10px;right:10px;width:28px;height:28px;display:grid;place-items:center;border-radius:4px;background:rgba(22,4,10,.85);color:var(--gold2);font-size:16px}
.pick-rank{cursor:pointer;transition:border-color .12s ease,opacity .12s ease}
.pick-rank:not(.ranked) .av{opacity:.92}
.pick-rank.ranked{border-color:var(--gold)}
.pick-rank.ranked .av{filter:saturate(1.05)}
.pick-rank .num{width:auto;min-width:34px;height:34px;font-size:19px}
.strip{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--muted);margin:0}
.strip b{color:var(--gold2)}
.valck{padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);font-weight:600;color:var(--text)}
.valck.on{border-color:var(--ok);color:var(--ok)}
.valck input[disabled]+*{opacity:.6}
.valok{color:var(--ok);font-weight:700;margin:0}
.login{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.lf{display:flex;flex-direction:column;gap:6px;flex:1 1 180px;min-width:0}
.lf.code{flex:0 1 130px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.pool .chip{height:36px}.pool .chip .av{width:28px}
.rank{display:flex;flex-direction:column;gap:5px}
.rk{display:grid;grid-template-columns:34px 30px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);padding:4px 6px 4px 4px;min-height:42px}
.rk.first{border-color:var(--gold)}
.rk .n{font:400 18px/1 var(--f-display);text-align:center;font-variant-numeric:tabular-nums}
.rk .av{width:30px;font-size:15px}
.rk .who{display:flex;flex-direction:column;min-width:0}
.rk .who b{font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.rk .who small{font-size:12px;color:var(--muted)}

/* cartes grand format : tableau + pronostic final (même taille que « Cette semaine ») */
.bracket{--ch:58px;gap:10px}
.bracket .col{width:150px;gap:8px}
.bracket .col-b{gap:5px;height:calc(var(--n) * (var(--ch) + 5px))}
.bracket .chip{position:relative;height:var(--ch);padding:4px 6px 4px 4px;gap:8px;border-width:2px}
.bracket .chip .av{width:40px;aspect-ratio:4/5;font-size:20px}
.bracket .chip .nm{font:400 15px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.bracket .chip .tg{font-size:11px}
.bracket .chip.ghost{justify-content:center;font:400 22px var(--f-display)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.pcard{position:relative;display:flex;flex-direction:column;gap:5px;background:var(--panel2);border:2px solid var(--line);border-radius:4px;padding:6px;text-align:left;min-width:0}
.pcard .av{width:100%;aspect-ratio:4/5;font-size:40px}
.pcard b{font:400 15px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard small{font-size:12px;color:var(--muted);line-height:1.2}
.pcard.first{border-color:var(--gold);box-shadow:0 0 18px rgba(248,201,74,.3)}
.pcard .num{position:absolute;top:10px;left:10px;z-index:1;min-width:30px;height:30px;padding:0 6px;display:grid;place-items:center;border-radius:15px;background:rgba(22,4,10,.88);border:1px solid var(--gold);color:var(--gold2);font:400 16px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pcard.first .num{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1300}
.pcard .rmx{position:absolute;top:10px;right:10px;z-index:1;width:30px;height:30px;background:rgba(22,4,10,.85);color:var(--text)}
.pcard.drag{cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.final .cards{min-height:150px}
@media (max-width:480px){
  .when{flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none}.pill{font-size:11px;padding:3px 6px;gap:4px;letter-spacing:.02em;white-space:nowrap}
  .brand .meta{font-size:13px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.pcard b{font-size:13px}}
.rk.drag{grid-template-columns:18px 30px 30px minmax(0,1fr) auto;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.grip{color:var(--muted);font-size:18px;line-height:1;text-align:center}
.rmx{background:transparent;border:1px solid var(--line);width:32px;height:32px;border-radius:3px;color:var(--muted);font-weight:700}
.chip.drag{cursor:grab;user-select:none;-webkit-user-select:none}
.drag-fly{opacity:.95!important;transform:rotate(2deg);box-shadow:0 14px 30px rgba(0,0,0,.6)}
.drag-ghost{opacity:.35;border:2px dashed var(--gold)!important}
.drag-chosen{border-color:var(--gold)!important;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.mv{display:flex;gap:4px;align-items:center}
.mv button{background:var(--bg);border:1px solid var(--line);width:34px;height:34px;border-radius:3px;font-weight:700}
.mv button[disabled]{opacity:.35;cursor:default}
.wk-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.lock{font-weight:700;font-size:14px;letter-spacing:.03em}
.lock.open{color:var(--ok)}.lock.closed{color:var(--ko)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.pick{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--panel2);border:2px solid var(--line);border-radius:4px;padding:6px;text-align:left}
.pick .av{width:100%;aspect-ratio:4/5;font-size:40px}
.pick b{font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:15px}

function recapLabel(id){const{y,m,d}=recapDate(id);const t=new Date(Date.UTC(y,m,d,12)).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});return t.charAt(0).toUpperCase()+t.slice(1);}
// anti-spoiler : la quotidienne du dimanche revient sur le prime du samedi ; masquée jusqu'à dimanche minuit
function recapSpoiler(id){if(!S.noSpoil)return false;const{y,m,d}=recapDate(id);if(new Date(Date.UTC(y,m,d)).getUTCDay()!==0)return false;
  return Date.now()<Date.UTC(y,m,d+1,0-parisOffset(y,m,d+1),0);}
function newestRecap(){const r=S.recaps.find(x=>!S.recapHidden.includes(x.id)&&!recapSpoiler(x.id)&&!recapNomHidden(x));return r?r.id:'';}

function cmTime(c){const ms=c.at||+c.id.split('_').pop();if(!ms)return'';const d=new Date(ms),now=Date.now(),diff=(now-ms)/60000;
  if(diff<1)return'à l’instant';if(diff<60)return'il y a '+Math.floor(diff)+' min';
  return d.toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'});}

function colsReal(){
  const s=S.season,win=winnerId(s),cur=curWeek(s),weeks=weekKeys(s).filter(n=>n<=cur);
  if(!win&&!weeks.includes(cur))weeks.push(cur);
  let alive=ids.slice();const cols=[];let last=0,pending=false;
  weeks.forEach(n=>{const w=wk(s,n),imm=wk(s,n-1).immune,done=w.out.length>0;
    cols.push({label:'Semaine '+n,sub:alive.length+' en lice',now:!done&&n===cur,
      chips:alive.map(id=>({id,st:w.out.includes(id)||w.quit.includes(id)?'ko':imm===id?'imm':w.nominees.includes(id)?'nom':'in'}))});
    alive=alive.filter(id=>!w.out.includes(id)&&!w.quit.includes(id));last=n;if(!done)pending=true;});

}

        :`<p class="muted">Les nominés sont annoncés ${esc(nextDay(3))}. Reviens alors choisir celui qui quitte le château.</p>`}</div>`;
  const immList=w.immCands.length?w.immCands.filter(id=>alive.includes(id)):alive;
  const imm=`<div class="card"><h3>Qui sera immunisé ?</h3><p class="muted">${w.immCands.length?`L’immunité se joue au prime de samedi entre ces ${immList.length} élèves.`:'L’élève protégé des nominations la semaine prochaine, désigné au prime de samedi.'}</p>

function vFinal(){

  }
  const next=`Touche l’élève n°${o.length+1}${o.length===0?' : ton vainqueur':o.length===N-1?' : le premier éliminé':''}.`;

    :full?(val?'Ton classement est validé. Pour le modifier, fais glisser un élève à sa nouvelle place, puis valide à nouveau.':'Classement complet, rangé dans ton ordre. Attrape un élève n’importe où sur sa carte et fais-le glisser à sa nouvelle place, puis valide.')
    :`Touche les élèves dans l’ordre : le 1er touché est ton vainqueur, le 17e le premier éliminé. Touche un élève déjà numéroté pour lui retirer son numéro. Chaque clic est enregistré. ${next}`;

function baroBlock(){
  const weeks=likeWeeks();if(!weeks.length)return'';
  const n=weeks.includes(S.lkWeek)?S.lkWeek:weeks[0],st=likeStats(n),out=outOrder(S.season);
  const rows=ids.filter(id=>st[id].up.length||st[id].down.length).map(id=>({id,a:st[id],...netTrend(id,n)}))
    .sort((x,y)=>y.net-x.net||y.a.up.length-x.a.up.length||x.a.down.length-y.a.down.length);
  let pos=0,prev=null;
  const list=rows.map((r,i)=>{if(r.net!==prev){pos=i+1;prev=r.net;}
    const who=[r.a.up.length?'❤️ '+whoNames(r.a.up):'',r.a.down.length?'🍅 '+whoNames(r.a.down):''].filter(Boolean).join(' · ');
    return`<div class="br"><span class="pos">${pos}</span>${av(r.id)}<span class="who"><b>${esc(C[r.id].name)}${out.includes(r.id)?' <span class="muted">(éliminé'+E(r.id)+')</span>':''}</b><small>❤️ ${r.a.up.length} · 🍅 ${r.a.down.length}</small><small>${who}</small></span><span class="net ${r.net>0?'pos':r.net<0?'neg':''}">${sgn(r.net)}${r.tr}</span></div>`;}).join('');
  const seg=weeks.length>1?`<div class="seg-bar">${weeks.map(w=>`<button class="seg${w===n?' on':''}" data-act="lkWeek" data-id="${w}" aria-pressed="${w===n}">S${w}</button>`).join('')}</div>`:'';
  const sw=`<button class="sw" role="switch" aria-checked="${S.lkChart}" data-act="lkChart" aria-label="Afficher en graphique">📊<i></i></button>`;
  const top=`<div class="baro-top">${seg}${sw}</div>`;
  // Graphique « papillon » : tomates à gauche de l'axe, cœurs à droite, même échelle des deux côtés.
  // Tous les élèves votables cette semaine-là (les éliminés des semaines précédentes sont exclus), même à zéro vote.
  const voted=new Set(rows.map(r=>r.id));
  const crows=rows.concat(likeEligible(n).filter(id=>!voted.has(id)).map(id=>({id,a:st[id],net:0})))
    .sort((x,y)=>y.net-x.net||y.a.up.length-x.a.up.length||x.a.down.length-y.a.down.length);
  const mx=Math.max(1,...crows.map(r=>Math.max(r.a.up.length,r.a.down.length)));
  const chart=`<div class="bfly" role="img" aria-label="Cœurs et tomates par élève, semaine ${n}"><div class="bf-leg"><span></span><span>🍅 Tomates</span><span>❤️ Cœurs</span><span></span></div>`+crows.map(r=>{const u=r.a.up.length,d=r.a.down.length;
    return`<div class="bf"><span class="nm">${esc(C[r.id].name)}</span><span class="sd l">${d?`<b>${d}</b><i style="width:${d/mx*82}%"></i>`:''}</span><span class="sd r">${u?`<i style="width:${u/mx*82}%"></i><b>${u}</b>`:''}</span><span class="bnet ${r.net>0?'pos':r.net<0?'neg':''}">${sgn(r.net)}</span></div>`;}).join('')+'</div>';
  const body=S.lkChart?chart:!rows.length?'<p class="empty">Aucun vote pour l’instant.</p>':`<div class="baro">${list}</div>`;

function recapCard(r,orga){
  const hid=S.recapHidden.includes(r.id),reg=registered()&&!S.anon;
  const{c,mine}=reactCounts(r.id);
  const cms=S.comments.filter(x=>x.recap===r.id);
  const rx=REACT.map(([k,e])=>`<button class="rx" data-act="react" data-id="${r.id}" data-k="${k}" aria-pressed="${mine.has(k)}" aria-label="Réagir ${e}">${e}${c[k]?`<b>${c[k]}</b>`:''}</button>`).join('');
  // fils : un commentaire racine et ses réponses (un seul niveau, une réponse à une réponse rejoint le même fil)
  const byId={},roots=[],reps={};cms.forEach(x=>byId[x.id]=x);
  cms.forEach(x=>{if(x.parent&&x.parent!==x.id){(reps[x.parent]=reps[x.parent]||[]).push(x);if(!byId[x.parent]&&!reps[x.parent].gone){reps[x.parent].gone=1;roots.push({id:x.parent,gone:true});}}else roots.push(x);});
  const one=(x,root)=>{if(x.gone)return`<div class="cm gone"><p>Commentaire supprimé</p></div>`;
    const p=S.players[x.uid],own=x.uid===S.uid,canDel=own||orga;
    return`<div class="cm"><span class="who"><b>${esc(p?p.name:'Ancien joueur')}</b> · ${esc(cmTime(x))}${canDel?`<button class="linkbtn del" data-act="cmDel" data-id="${esc(x.id)}">${S.cmDelArm===x.id?'Confirmer la suppression':'Supprimer'}</button>`:''}</span>${own?`<p>${esc(x.text)}</p>`:msgBody(x.text,x.id)}${reg?`<button class="linkbtn rep" data-act="cmReply" data-id="${esc(root)}" data-to="${esc(x===byId[root]||own||!p?'':p.name)}">Répondre</button>`:''}</div>`;};
  const cmList=roots.map(x=>{const rs=reps[x.id]||[],k='cr-'+x.id;
    const rf=reg&&S.cmReply===x.id?`<div class="cmform"><textarea id="${esc(k)}" maxlength="500" rows="2" placeholder="Ta réponse…" aria-label="Ta réponse">${esc(S.drafts[k]||'')}</textarea><button class="btn" data-act="cmSendRe" data-id="${esc(x.id)}" data-rc="${r.id}">Répondre</button></div>`:'';
    return`<div class="cmth">${one(x,x.id)}${rs.length||rf?`<div class="cmrs">${rs.map(y=>one(y,x.id)).join('')}${rf}</div>`:''}</div>`;}).join('');
  const form=reg?`<div class="cmform"><textarea id="cm-${r.id}" maxlength="500" rows="2" placeholder="Ton commentaire…" aria-label="Ton commentaire">${esc(S.drafts[r.id]||'')}</textarea><button class="btn" data-act="cmSend" data-id="${r.id}">Envoyer</button></div>`:'';
  return`<article class="card recap${hid?' hid':''}" id="rc-${r.id}">
    <div class="rc-h"><span class="rc-date">${esc(recapLabel(r.id))}</span>${r.tag==='nominations'?'<span class="pill">Nominations</span>':''}${hid?'<span class="pill">Masqué aux joueurs</span>':''}</div>
    <h3>${esc(r.title)}</h3>
    ${r.points.length?`<ul class="rc-pts">${r.points.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
    ${r.eleves.length?`<div class="rc-el">${r.eleves.map(id=>`<button class="chip" data-act="goSel" data-id="${id}">${av(id)}<span class="nm">${esc(C[id].name)}</span></button>`).join('')}</div>`:''}
    ${r.sources.length?`<p class="rc-src">D’après ${r.sources.map(o=>`<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.name)}</a>`).join(', ')}</p>`:''}
    <div class="rc-react">${rx}</div>
    ${orga?`<div class="row"><button class="btn ghost" data-act="recapHide" data-id="${r.id}">${hid?'Réafficher':'Masquer'}</button></div>`:''}
    <div class="cms"><span class="muted">💬 ${cms.length?cms.length+' commentaire'+(cms.length>1?'s':''):'Aucun commentaire pour l’instant.'}</span>${cmList}${form}</div>
  </article>`;
}

const BADLOGIN=['auth/invalid-credential','auth/user-not-found','auth/wrong-password','auth/invalid-login-credentials'];
async function join(){
  const ni=$('#pname'),ci=$('#pcode'),name=(ni?ni.value:'').trim().slice(0,40),code=(ci?ci.value:'').trim(),slug=loginSlug(name);
  if(!slug){toast('Écris un pseudo avec au moins une lettre ou un chiffre.');if(ni)ni.focus();return;}
  if(!/^\d{4,8}$/.test(code)){toast('Le code doit faire 4 à 8 chiffres.');if(ci)ci.focus();return;}
  if(!fb||!fb.auth){toast('Connexion en cours, réessaie dans un instant.');return;}
  const A=fb.authM,email=slug+'@pronos-star-ac.firebaseapp.com',pw='sa14-'+code;
  S.busy=true;render();
  let created=false;
  try{
    try{await A.signInWithEmailAndPassword(fb.auth,email,pw);}
    catch(e){
      if(!BADLOGIN.includes(e&&e.code))throw e;
      const cur=fb.auth.currentUser,cred=A.EmailAuthProvider.credential(email,pw);
      try{if(cur&&cur.isAnonymous)await A.linkWithCredential(cur,cred);else await A.createUserWithEmailAndPassword(fb.auth,email,pw);created=true;}
      catch(e2){if(e2&&e2.code==='auth/email-already-in-use'){toast('Ce pseudo est déjà pris et le code ne correspond pas.');return;}throw e2;}
    }
    const u=fb.auth.currentUser;S.uid=u.uid;S.anon=false;S.login=slug;
    const snap=await fb.fs.getDoc(fb.fs.doc(fb.db,'players',u.uid));
    if(!snap.exists())await fb.fs.setDoc(fb.fs.doc(fb.db,'players',u.uid),{name,order:[],updatedAt:fb.fs.serverTimestamp()});
    S.meDirty=false;S.form={name:null,code:''};syncMe();
    toast(created?`Bienvenue ${name} ! Retiens ton code.`:`Content de te revoir ${snap.exists()?snap.data().name:name} !`);
  }catch(e){
    const c=e&&e.code||'';
    toast(c==='auth/operation-not-allowed'?'La connexion par code n’est pas encore activée par l’organisateur.':c==='auth/too-many-requests'?'Trop d’essais. Patiente quelques minutes.':isNetErr(e)?(S.note=BLOCK_MSG,'Connexion bloquée.'):'Connexion impossible ('+errText(e)+').');
  }finally{S.busy=false;render();}
}

async function initFirebase(){
  if(!firebaseConfig||!firebaseConfig.apiKey){S.conn='noconfig';render();return;}
  try{
    const [appM,authM,fs]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    const app=appM.initializeApp(firebaseConfig),auth=authM.getAuth(app),db=fs.getFirestore(app);
    fb={db,fs,auth,authM,app};
    const fail=what=>err=>{S.note=`Lecture ${what} impossible (${errText(err)}).`;render();};
    fs.onSnapshot(fs.doc(db,'season','main'),snap=>{S.snapOk=true;if(S.note===BLOCK_MSG&&S.authReady)S.note='';S.seasonExists=snap.exists();setReal(normSeason(snap.exists()?snap.data():null));S.conn='ok';render();},fail('de la saison'));
    fs.onSnapshot(fs.collection(db,'players'),q=>{const p={};q.forEach(d=>{const x=d.data();if(x&&typeof x.name==='string'&&x.name.trim())p[d.id]={name:x.name.trim().slice(0,40),order:cleanOrder(x.order),validated:x.validated===true};});S.players=p;syncMe();if(registered()&&!S.anon)startPresence();render();},fail('des joueurs'));
    fs.onSnapshot(fs.collection(db,'picks'),q=>{const p={};q.forEach(d=>{const x=d.data();if(x&&typeof x.uid==='string'&&Number.isInteger(x.week))p[x.week+'_'+x.uid]={uid:x.uid,week:x.week,elim:C[x.elim]?x.elim:null,immune:C[x.immune]?x.immune:null};});S.picks=p;render();},fail('des choix'));
    fs.onSnapshot(fs.collection(db,'presence'),q=>{const r={};q.forEach(d=>{const t=toMs(d.data().at);if(t)r[d.id]=t;});S.presence=r;render();},()=>{});
    fs.onSnapshot(fs.collection(db,'likes'),q=>{const r={};q.forEach(d=>{const x=d.data();if(x&&typeof x.uid==='string'&&Number.isInteger(x.week))r[x.week+'_'+x.uid]={uid:x.uid,week:x.week,up:cleanOrder(x.up).slice(0,lkMax(x.week,'up')),down:cleanOrder(x.down).slice(0,lkMax(x.week,'down'))};});S.likes=r;render();},()=>{});
    fs.onSnapshot(fs.collection(db,'likeprefs'),q=>{const r={};q.forEach(d=>{const x=d.data();if(x&&x.anon===true)r[d.id]=true;});S.likePrefs=r;render();},()=>{});
    fs.onSnapshot(fs.doc(db,'season','recaps'),snap=>{const d=snap.exists()?snap.data():{};S.recapHidden=Array.isArray(d.hidden)?d.hidden.filter(x=>typeof x==='string'):[];render();},()=>{});
    fs.onSnapshot(fs.collection(db,'reactions'),q=>{const r={};q.forEach(d=>{const x=d.data();if(x&&typeof x.uid==='string'&&typeof x.recap==='string'&&Array.isArray(x.e))r[d.id]={uid:x.uid,recap:x.recap,e:x.e.filter(k=>RCODES.includes(k))};});S.reacts=r;render();},()=>{});
    fs.onSnapshot(fs.collection(db,'comments'),q=>{const c=[];q.forEach(d=>{const x=d.data();if(x&&typeof x.uid==='string'&&typeof x.recap==='string'&&typeof x.text==='string')c.push({id:d.id,uid:x.uid,recap:x.recap,text:x.text.slice(0,500),at:toMs(x.at),parent:typeof x.parent==='string'?x.parent:null});});
      c.sort((a,b)=>(a.at||+a.id.split('_').pop())-(b.at||+b.id.split('_').pop()));S.comments=c;render();},()=>{});
    let first=true;
    authM.onAuthStateChanged(auth,u=>{
      S.uid=u?u.uid:null;S.anon=!!(u&&u.isAnonymous);if(u)S.authReady=true;
      if(u&&!u.isAnonymous){if(S.npUnsub)S.npUnsub();S.npUnsub=fs.onSnapshot(fs.doc(db,'notifprefs',u.uid),d=>{S.notifPrefs=d.exists()?d.data():null;render();if(registered())syncNoNom();},()=>{});}
      if(u&&S.snapOk&&S.note===BLOCK_MSG){S.note='';S.conn='ok';}
      S.login=u&&u.email?u.email.split('@')[0]:'';
      S.meDirty=false;S.me={name:'',order:[]};syncMe();render();
      if(!u&&first){first=false;authM.signInAnonymously(auth).catch(e=>{S.conn='err';S.note=isNetErr(e)?BLOCK_MSG:'Connexion à la base de données impossible ('+errText(e)+'). Recharge la page.';render();});}
      first=false;
    });
  }catch(e){S.conn='err';S.note=BLOCK_MSG;render();}
  setTimeout(()=>{if(S.conn==='loading'||(S.conn==='ok'&&!S.authReady)){S.conn='err';S.note=BLOCK_MSG;render();}},12000);
}

    <label class="check"><input type="checkbox" data-np="prime"${np.prime?' checked':''}> Le début du prime (samedi soir)</label>
    <label class="check"><input type="checkbox" data-np="thread"${np.thread?' checked':''}> Les nouveaux commentaires sur les quotidiennes où j’ai commenté</label>
    <label class="check"><input type="checkbox" data-np="all"${np.all?' checked':''}> Tous les nouveaux commentaires sur les quotidiennes</label>
    <p class="muted">Les notifications de commentaires arrivent avec quelques minutes de décalage (5 à 15 min environ). Tes propres commentaires ne te sont jamais notifiés.</p></div>`;}
function notifState(){
  if(!vapidKey)return'off';
  if(notifOn())return'on';
  if(isIOS()&&!standalone())return'ios-install';
  if(!pushOK())return'unsupported';
  if(Notification.permission==='denied')return'denied';
  return'ready';}
function notifCard(force){
  const st=notifState();if(st==='off')return'';
  if(st==='on')return force?`<div class="card notifcard on"><p>🔔 <b>Notifications activées sur cet appareil.</b></p>${notifPrefsBlock()}
    <div class="row"><button class="btn ghost" data-act="notifTest">Tester sur ce téléphone</button><button class="linkbtn" data-act="notifOff">Désactiver</button></div></div>`:'';
  if(!force&&ls.get('sa14-notifLater')==='1')return'';
  const later=force?'':`<button class="linkbtn" data-act="notifLater">Plus tard</button>`;
  const head=`<h3>🔔 Active les notifications</h3><p class="muted">Pour être prévenu au début du prime, et si tu le souhaites des nouveaux commentaires sur les quotidiennes. Tu choisis quoi recevoir une fois activées.</p>`;
  let body='';
  if(st==='ios-install')body=`<ol class="steps">
      <li>Ouvre ce site dans <b>Safari</b> (pas Chrome ni l’appli Instagram/WhatsApp).</li>
      <li>Touche <b>Partager</b> <span class="ico">⬆︎</span> en bas de l’écran (le carré avec une flèche).</li>
      <li>Fais défiler et choisis <b>« Sur l’écran d’accueil »</b>, puis <b>Ajouter</b>.</li>
      <li>Ouvre <b>Pronos Star Ac</b> depuis l’icône ⭐ de ton écran d’accueil et reviens ici.</li>
      <li>Touche <b>Activer</b> puis <b>Autoriser</b>.</li></ol>
    <p class="muted">Apple n’autorise les notifications que depuis l’appli installée (iOS 16.4 ou plus récent).</p>`;
  else if(st==='unsupported')body=`<p>Ce navigateur ne gère pas les notifications. Sur Android, ouvre le site dans <b>Chrome</b> ; sur iPhone, dans <b>Safari</b>.</p>`;
  else if(st==='denied')body=`<p>Les notifications sont <b>bloquées</b> pour ce site. Pour les débloquer :</p><ul class="steps">
      <li><b>iPhone</b> : Réglages → Notifications → <b>Pronos Star Ac</b> → Autoriser les notifications.</li>
      <li><b>Android (Chrome)</b> : touche le cadenas à gauche de l’adresse (ou les ⋮ → Infos) → Autorisations → <b>Notifications</b> → Autoriser.</li></ul>
    <p class="muted">Puis recharge la page et touche Activer.</p><div class="row"><button class="btn" data-act="notifOn">Activer</button>${later}</div>`;
  else body=`<ol class="steps"><li>Touche <b>Activer</b>.</li><li>Ton téléphone demande l’autorisation : réponds <b>Autoriser</b>.</li></ol>
    <div class="row"><button class="btn" data-act="notifOn">🔔 Activer</button>${later}</div>`;
  if(st==='ios-install'||st==='unsupported')body+=later?`<div class="row">${later}</div>`:'';
  return`<div class="card notifcard">${head}${body}</div>`;}
function notifRow(){
  if(!vapidKey)return'';
  if(notifOn())return`<p class="notifrow">🔔 Notification au début du prime activée sur cet appareil. <button class="linkbtn" data-act="notifTest">Tester</button> · <button class="linkbtn" data-act="notifOff">Désactiver</button></p>`;
  return`<div class="row notifrow"><button class="btn ghost" data-act="notifShow">🔔 Me prévenir au début du prime</button></div>`;}
async function enableNotif(){
  if(!vapidKey||!fb){toast('Notifications indisponibles pour l’instant.');return;}
  if(isIOS()&&!standalone()){S.tab='settings';render();window.scrollTo(0,0);return;}
  if(!pushOK()){toast('Ce navigateur ne gère pas les notifications.');return;}
  if(!registered()||S.anon){toast('Connecte-toi avec ton pseudo d’abord.');return;}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){S.notifForce=true;render();toast(perm==='denied'?'Notifications bloquées : autorise-les dans les réglages du navigateur pour ce site.':'Notifications non autorisées.');return;}
    const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
    const m=await import(FB+'firebase-messaging.js');
    const token=await m.getToken(m.getMessaging(fb.app),{vapidKey,serviceWorkerRegistration:reg});
    if(!token)throw new Error('pas de jeton');
    await fb.fs.setDoc(fb.fs.doc(fb.db,'pushTokens',token),{uid:S.uid,at:fb.fs.serverTimestamp()});
    ls.set('sa14-push','1');ls.set('sa14-pushtok',token);S.notifForce=true;render();toast('C’est noté : tu seras prévenu au début de chaque prime.');testNotif();
  }catch(e){toast('Activation impossible ('+(e&&(e.code||e.message)||'erreur')+').');}
}
async function testNotif(){
  try{const reg=await navigator.serviceWorker.ready;await reg.showNotification('Test des notifications ✅',{body:'Elles s’affichent bien sur ce téléphone.',icon:'icons/icon-192.png',tag:'test'});toast('Notification de test envoyée.');}
  catch(e){toast('Test impossible ('+(e&&e.message||'erreur')+').');}}
async function disableNotif(){
  const t=ls.get('sa14-pushtok');ls.del('sa14-push');render();
  try{if(t&&fb)await fb.fs.deleteDoc(fb.fs.doc(fb.db,'pushTokens',t));
    const m=await import(FB+'firebase-messaging.js');await m.deleteToken(m.getMessaging(fb.app));}catch(e){}
  ls.del('sa14-pushtok');toast('Notifications désactivées sur cet appareil.');
}
(function(){const q=new URLSearchParams(location.search),rc=q.get('rc');if(rc&&/^\d{4}-\d{2}-\d{2}$/.test(rc)){S.deepRc=rc;S.tab='daily';history.replaceState(null,'',location.pathname);}
  const pr=q.get('pr');if(pr&&/^\d{1,2}$/.test(pr)&&+pr<=latestPrime()){S.tab='prime';S.primeSel=+pr;S.primeSub='songs';history.replaceState(null,'',location.pathname);}})();
// pendant le prime, l'ouverture de l'appli (ou son retour au premier plan) bascule une fois sur l'onglet Prime ; l'onglet mémorisé reste inchangé
function autoPrime(){const n=latestPrime();if(S.autoPrimeFor===n||!primeLive(n))return false;S.autoPrimeFor=n;
  if(S.deepRc||S.tab==='orga'||S.tab==='prime')return false;S.tab='prime';S.primeSel=null;S.viewPlayer=null;S.pendingOut=null;return true;}
autoPrime();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&autoPrime()){render();window.scrollTo(0,0);}});
/* ===================== clavier mobile : garder le champ visible ===================== */
const isTyping=el=>el&&el.tagName==='TEXTAREA'&&/^(cm-|cr-|sr-|sq-|pc-input)/.test(el.id);
function revealField(el){if(!el)return;const vv=window.visualViewport;
  const r=el.getBoundingClientRect(),vh=vv?vv.height:innerHeight,top=vv?vv.offsetTop:0;
  if(r.bottom>top+vh-8||r.top<top+70){el.scrollIntoView({block:'center',behavior:'smooth'});}}
document.addEventListener('focusin',e=>{if(isTyping(e.target)){const el=e.target;setTimeout(()=>revealField(el),350);setTimeout(()=>revealField(el),800);}});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const el=document.activeElement;if(isTyping(el))setTimeout(()=>revealField(el),60);});
/* ===================== application installable ===================== */
function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function isIOS(){return/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
let installEvt=null;
function showInstallBtn(){const b=$('#install-btn');if(b)b.hidden=standalone()||!(installEvt||isIOS());}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;showInstallBtn();});
window.addEventListener('appinstalled',()=>{installEvt=null;showInstallBtn();toast('Application installée !');});
async function doInstall(){
  if(installEvt){installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;showInstallBtn();render();return;}
  if($('.install-help'))return;
  const d=document.createElement('div');d.className='install-help';d.setAttribute('role','dialog');
  d.innerHTML='<p><b>Sur iPhone / iPad (Safari)</b> : touche le bouton <b>Partager</b> (carré avec une flèche), puis <b>« Sur l’écran d’accueil »</b>.</p><p>Si tu es dans Chrome ou une autre appli, ouvre d’abord le site dans Safari.</p><button class="btn" type="button">OK</button>';
  d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d);}
$('#install-btn').addEventListener('click',doInstall);
showInstallBtn();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
initFirebase();
loadRecaps(true);
</script>
</body>
